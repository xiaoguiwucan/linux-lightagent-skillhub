name: 技能校验
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/build_registry.py --output dist
      - run: python -m unittest discover -s tests
      - name: Linux container non-root package smoke test
        run: docker run --rm --user 65534:65534 -v "$PWD:/hub:ro" -w /hub python:3.12-slim python scripts/docker_smoke.py
      - uses: actions/checkout@v4
        with:
          repository: xiaoguiwucan/linux-lightagent
          ref: main
          path: lightagent-main
      - name: Current Linux LightAgent main compatibility test
        run: docker run --rm --user 65534:65534 -e PYTHONPATH=/lightagent-main -v "$PWD:/hub:ro" -v "$PWD/lightagent-main:/lightagent-main:ro" -w /hub python:3.12-slim python scripts/lightagent_main_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: skillhub-preview
          path: dist
