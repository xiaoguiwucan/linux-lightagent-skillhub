<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Linux LightAgent Skill Hub</title>
  <meta name="description" content="Linux LightAgent 专属技能中心">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="./">Linux LightAgent <span>Skill Hub</span></a>
    <a href="https://github.com/xiaoguiwucan/linux-lightagent-skillhub">GitHub</a>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow">OFFICIAL REGISTRY</p>
      <h1>Linux LightAgent 技能中心</h1>
      <p>技能按 Linux、Docker、微信群权限和有序发送规范审核，可直接在 Linux LightAgent 中安装。</p>
    </section>
    <section class="toolbar" aria-label="技能筛选">
      <input id="search" type="search" placeholder="搜索技能、标签或作者" autocomplete="off">
    </section>
    <p id="status" role="status">正在加载注册表...</p>
    <section id="skills" class="skills" aria-live="polite"></section>
  </main>
  <template id="skill-template"><article><div class="title"><h2></h2></div><p class="description"></p><div class="meta"></div><code></code><a class="details">查看源码</a></article></template>
  <script src="app.js"></script>
</body>
</html>
